services:
  - type: web
    name: medihub
    runtime: node
    rootDir: .
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && node server.js
    # Render restarts the service if the API or its database stops answering.
    healthCheckPath: /api/health/db
    envVars:
      - key: NODE_ENV
        value: production
